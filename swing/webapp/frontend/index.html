<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>量化策略台 · Quant Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f7f4ed;
        --panel: #fffdf8;
        --ink: #17140f;
        --ink-soft: #5b554a;
        --accent: #0b6e4f;
        --line: #e6e0d3;
        --up: #c0392b;
        --down: #1f8e5a;
        --font-display: "Fraunces", Georgia, serif;
        --font-sans: "IBM Plex Sans", -apple-system, "PingFang SC", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      html, body { margin: 0; }
      body {
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 32px 32px;
        background-position: -1px -1px;
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .ant-table, .ant-statistic-content, .num, table { font-variant-numeric: tabular-nums; }
      .ant-table-cell { font-variant-numeric: tabular-nums; }
      .md table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
      .md th, .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
      .md th { background: #f1ede3; }
      .md h1, .md h2, .md h3 { font-size: 14px; margin: 8px 0 4px; font-family: var(--font-display); }
      .md p { margin: 4px 0; }
      .md ul { margin: 4px 0; padding-left: 18px; }
      ::selection { background: #0b6e4f22; }
      .hold-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; margin: 0 8px 8px 0;
        background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 13px;
        cursor: pointer; transition: all .12s ease; }
      .hold-chip:hover { border-color: var(--accent); background: #f1f6f2; box-shadow: 0 3px 10px -5px #0b6e4f88; transform: translateY(-1px); }
      .hold-code { color: #9b958a; font-family: var(--font-mono); font-size: 11px; }
      .hold-tag { background: var(--accent); color: #fff; border-radius: 4px; padding: 0 5px; font-size: 10px; line-height: 16px; font-weight: 600; }
      .cursor { animation: blink 1s step-end infinite; color: var(--accent); font-weight: 700; }
      @keyframes blink { 50% { opacity: 0; } }
      /* LLM 分析 聊天布局 */
      .chat-msg { display: flex; gap: 10px; margin-bottom: 14px; animation: msgin .35s ease both; }
      @keyframes msgin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .chat-av { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 2px 8px -3px rgba(23,20,15,.35); }
      .chat-body { flex: 1; min-width: 0; }
      .chat-role { font-size: 12px; font-weight: 600; color: #5b554a; margin-bottom: 3px; }
      .chat-bubble { background: #fffdf8; border: 1px solid #ece7db; border-radius: 4px 12px 12px 12px; padding: 9px 12px; font-size: 13px; line-height: 1.7; }
      .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 1px; background: #b7b0a2; border-radius: 50%; animation: td 1.2s infinite; }
      .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
      @keyframes td { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
      .dbg-in { animation: msgin .3s ease both; }
      .dbg-md p, .dbg-md li { margin: 3px 0; }
      .ana-chip { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; padding: 2px 10px 2px 8px;
        font-size: 12px; font-weight: 600; color: var(--accent); background: #eaf5ef;
        border: 1px solid #bfe0d0; border-radius: 999px; vertical-align: middle; }
      .ana-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px #0b6e4f22; }
      .ana-redo { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 2px 12px;
        font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--panel);
        border: 1px solid var(--line); border-radius: 999px; cursor: pointer; vertical-align: middle;
        transition: all .14s ease; }
      .ana-redo:hover { color: var(--accent); border-color: var(--accent); background: #f1f6f2;
        box-shadow: 0 3px 10px -5px #0b6e4f88; transform: translateY(-1px); }
      .concept-main-row > td { background: #fbecec !important; }
      .rrg-flow line { animation: rrgflow .7s linear infinite; }
      @keyframes rrgflow { to { stroke-dashoffset: -12; } }
      .verdict-card { animation: pop .5s cubic-bezier(.2,1.3,.4,1) both; }
      @keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
