<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>量化策略台 · 访问口令</title>
<style>
  :root { --paper:#f7f4ed; --panel:#fffdf8; --ink:#17140f; --soft:#8a8272; --accent:#0b6e4f; --line:#e6e0d3; --warn:#b2564e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         background:var(--paper); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:32px 28px; box-shadow:0 12px 40px rgba(23,20,15,.07); }
  .brand { font-size:20px; font-weight:800; letter-spacing:.5px; }
  .kicker { font-size:11px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-top:4px; }
  .hint { font-size:13px; color:var(--soft); line-height:1.7; margin:20px 0 18px; }
  input { width:100%; padding:11px 13px; font-size:15px; border:1px solid var(--line); border-radius:8px;
          background:var(--paper); color:var(--ink); outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; margin-top:12px; padding:11px; font-size:15px; font-weight:600; color:#fff; cursor:pointer;
           background:var(--accent); border:none; border-radius:8px; }
  button:disabled { opacity:.55; cursor:default; }
  .err { min-height:20px; margin-top:10px; font-size:13px; color:var(--warn); }
  .foot { margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--soft); line-height:1.8; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">量化策略台</div>
    <div class="kicker">Quant Terminal</div>
    <div class="hint">{{MSG}}，输入口令后可浏览。口令找站主要。</div>
    <input id="pw" type="password" placeholder="访问口令" autocomplete="off" autofocus>
    <button id="go">进入</button>
    <div class="err" id="err"></div>
    <div class="foot">
      这是一个临时对外的只读展示站，随时会关。<br>
      模型训练、LLM 分析、数据修改在外网一律停用。
    </div>
  </div>
<script>
  const pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err')
  async function submit() {
    if (!pw.value) return
    go.disabled = true; err.textContent = ''
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ pass: pw.value }) })
      const j = await r.json()
      if (j.ok) { location.replace('/') } else { err.textContent = j.error || '验证失败'; pw.select() }
    } catch (e) { err.textContent = '网络错误，稍后再试' } finally { go.disabled = false }
  }
  go.onclick = submit
  pw.onkeydown = e => { if (e.key === 'Enter') submit() }
</script>
</body>
</html>
